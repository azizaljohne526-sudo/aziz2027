<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1711"><title>حلال أبو خالد</title><style>
:root{--bg:#09140f;--panel:#122219;--line:#294936;--txt:#f2f5f3;--muted:#aab5ae;--green:#2fa052;--green2:#42b765;--red:#b53c3c}body.light{--bg:#f4f7f4;--panel:#fff;--line:#cfe0d4;--txt:#142018;--muted:#647268}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}.app{max-width:1180px;margin:auto;padding:18px}.hero{background:var(--green);border-radius:28px;padding:24px;display:flex;justify-content:space-between;align-items:center}.hero h1{margin:0;font-size:36px}.hero p{margin:6px 0 0}.topbtn{border:0;border-radius:16px;padding:13px 17px;background:#ffffff20;color:#fff;font-size:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}.stat b{display:block;color:var(--green2);font-size:30px;direction:ltr;text-align:right}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.nav{padding:24px 14px;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--txt);font-weight:700;font-size:20px}.page{display:none}.page.active{display:block}.head{display:flex;align-items:center;justify-content:space-between;margin:16px 0}.back,.primary,.secondary,.danger{border:0;border-radius:14px;padding:12px 16px;color:#fff;font-weight:700}.back,.primary{background:var(--green)}.secondary{background:#24372d}.danger{background:#5b2626;color:#ffb2b2;border:1px solid #c78686}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form .full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:14px;margin-bottom:5px}input,select,textarea{width:100%;background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:13px}select option{color:#111}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.item{margin-top:12px}.item h3{margin:0 0 8px}.small{color:var(--muted);font-size:14px}.search{margin:12px 0}.filter{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.filter button{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:12px}.empty{text-align:center;color:var(--muted);padding:40px}.pill{display:inline-block;background:#153e24;color:#55c777;border-radius:999px;padding:5px 10px;font-size:13px}.money{direction:ltr;display:inline-block}.about{text-align:center;font-size:20px;line-height:2}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}.modal.show{display:flex}.modal .card{width:min(700px,100%);max-height:90vh;overflow:auto}@media(max-width:760px){.app{padding:10px}.hero h1{font-size:28px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.nav{font-size:17px;padding:20px 8px}}
</style></head><body><div class="app"><header class="hero"><div><h1>🐑 حلال أبو خالد</h1><p>إدارة ومتابعة الحلال</p></div><div><button class="topbtn" onclick="toggleTheme()">☀️ / 🌙</button></div></header><main id="home" class="page active"><div class="stats"><div class="stat"><b id="sHerd">0</b>عدد الحلال الحالي</div><div class="stat"><b id="sEwes">0</b>النعاج المنتجة</div><div class="stat"><b id="sBirths">0</b>المواليد الحالي</div><div class="stat"><b id="sAlerts">0</b>التنبيهات</div></div><div class="stats"><div class="stat"><b id="sSales">0</b>إجمالي البيع</div><div class="stat"><b id="sPurch">0</b>إجمالي المشتريات</div><div class="stat"><b id="sExp">0</b>إجمالي المصاريف</div><div class="stat"><b id="sProfit">0</b>الربح / الخسارة</div></div><div class="grid" id="nav"></div></main><section id="view" class="page"></section></div><div class="modal" id="modal"><div class="card" id="modalBody"></div></div><input type="file" id="restoreFile" accept="application/json" hidden><script>
const K='aziz2027-db-v1';const blank={ewes:[],births:[],deaths:[],purchases:[],expenses:[],sales:[],vaccines:[],inventory:[],treatments:[],notes:[],movements:[]};let db=Object.assign({},blank,JSON.parse(localStorage.getItem(K)||'{}'));let editing=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const id=()=>Date.now()+Math.random().toString(16).slice(2);const today=()=>new Date().toISOString().slice(0,10);const n=x=>Number(x)||0;const fmt=x=>new Intl.NumberFormat('en-US').format(n(x));function save(){localStorage.setItem(K,JSON.stringify(db));refresh()}function ensureIds(){['ewes','births','deaths','purchases','expenses','sales','vaccines','inventory','movements','treatments'].forEach(type=>{if(!Array.isArray(db[type]))db[type]=[];db[type].forEach(r=>{if(!r.id)r.id=id()})});localStorage.setItem(K,JSON.stringify(db))}function addMove(type,text){db.movements.unshift({id:id(),type,text,date:new Date().toISOString()})}function days(a,b=new Date()){return Math.floor((new Date(b)-new Date(a))/86400000)}function addMonths(ds,m){let d=new Date(ds);d.setMonth(d.getMonth()+m);return d.toISOString().slice(0,10)}function ageText(ds){let d=Math.max(0,days(ds));let y=Math.floor(d/360),r=d%360,mo=Math.floor(r/30),da=r%30;return [y?y+' سنة':'',mo?mo+' شهر':'',da||(!y&&!mo)?da+' يوم':''].filter(Boolean).join(' و ')}function money(x){return fmt(x)+' ريال'}
function birthMix(type,custom='',manualCount=1){type=String(type||'');custom=String(custom||'').trim();if(type==='طلي')return{count:1,males:1,females:0};if(type==='رخلة')return{count:1,males:0,females:1};if(type==='طليان')return{count:2,males:2,females:0};if(type==='رخلتين')return{count:2,males:0,females:2};if(type==='طلي ورخلة')return{count:2,males:1,females:1};let males=0,females=0,txt=custom||type,m=txt.match(/(\d+)\s*(?:طلي|طليان)/),f=txt.match(/(\d+)\s*(?:رخلة|رخل|رخال)/);if(m)males=n(m[1]);if(f)females=n(f[1]);return{count:males+females||n(manualCount)||1,males,females}}
function normalizeBirth(b){let m=birthMix(b.type,b.custom,b.count);return Object.assign({},b,{count:n(b.count)>1?n(b.count):m.count,males:b.males!=null?n(b.males):m.males,females:b.females!=null?n(b.females):m.females})}
function birthTotals(){return db.births.reduce((a,x)=>{let b=normalizeBirth(x);a.count+=n(b.count);a.males+=n(b.males);a.females+=n(b.females);return a},{count:0,males:0,females:0})}function currentHerdCount(){let liveBirth=birthTotals().count-db.deaths.filter(x=>x.kind==='مولود').reduce((a,b)=>a+n(b.count),0);let eweDeaths=db.deaths.filter(x=>x.kind==='نعجة').reduce((a,b)=>a+n(b.count),0),eweSales=db.sales.filter(x=>x.type==='نعجة').reduce((a,b)=>a+n(b.count),0);return Math.max(0,db.ewes.length+liveBirth-eweDeaths-eweSales)}
function normalizeSaudiPhone(phone){let d=String(phone||'').replace(/\D/g,'');if(d.startsWith('00966'))d=d.slice(2);if(d.startsWith('9660'))d='966'+d.slice(4);else if(d.startsWith('05'))d='966'+d.slice(1);else if(d.startsWith('5')&&d.length===9)d='966'+d;return d}
const pages=[['herd','🐑 سجل القطيع'],['births','👶 المواليد'],['deaths','☠️ النفوق'],['purchases','🛒 المشتريات'],['expenses','💰 المصاريف'],['sales','💵 البيع'],['vaccines','💉 التطعيمات'],['eweReport','📋 تقرير النعاج'],['inventory','📦 جرد الحلال'],['birthReport','📊 تقرير المواليد'],['production','🏆 إنتاج النعاج'],['alerts','🔔 التنبيهات'],['season','📅 موسم الولادات'],['profit','📈 الربح والخسارة'],['summary','📋 الملخص'],['movement','🕘 سجل الحركة'],['backup','💾 النسخة الاحتياطية'],['buyers','👥 سجل المشترين'],['treatments','💊 سجل العلاجات'],['about','👤 نبذة عن صاحب البرنامج']];$('#nav').innerHTML=pages.map(p=>`<button class="nav" onclick="openPage('${p[0]}')">${p[1]}</button>`).join('');
function refresh(){let liveBirth=birthTotals().count-db.deaths.filter(x=>x.kind==='مولود').reduce((a,b)=>a+n(b.count),0);let eweDeaths=db.deaths.filter(x=>x.kind==='نعجة').reduce((a,b)=>a+n(b.count),0),eweSales=db.sales.filter(x=>x.type==='نعجة').reduce((a,b)=>a+n(b.count),0);let herd=currentHerdCount();let sales=db.sales.reduce((a,b)=>a+n(b.total),0),pur=db.purchases.reduce((a,b)=>a+n(b.total),0),exp=db.expenses.reduce((a,b)=>a+n(b.amount),0);$('#sHerd').textContent=fmt(herd);$('#sEwes').textContent=fmt(db.ewes.length);$('#sBirths').textContent=fmt(Math.max(0,liveBirth));$('#sAlerts').textContent=fmt(alertData().length);$('#sSales').textContent=fmt(sales);$('#sPurch').textContent=fmt(pur);$('#sExp').textContent=fmt(exp);$('#sProfit').textContent=fmt(sales-pur-exp)}
function shell(title,body){$('#home').classList.remove('active');$('#view').classList.add('active');$('#view').innerHTML=`<div class="head"><h2>${title}</h2><button class="back" onclick="home()">⬅️ الرجوع للرئيسية</button></div>${body}`}function home(){$('#view').classList.remove('active');$('#home').classList.add('active');refresh()}function card(x){return `<div class="card item">${x}</div>`}function btns(type,r){return `<div class="actions"><button type="button" class="secondary js-edit" data-type="${esc(type)}" data-id="${esc(r.id)}">✏️ تعديل</button><button type="button" class="danger js-delete" data-type="${esc(type)}" data-id="${esc(r.id)}">🗑️ حذف</button></div>`}function formOpen(title,html,onSave){$('#modalBody').innerHTML=`<h2>${title}</h2><form id="f">${html}<div class="actions"><button class="primary">💾 حفظ</button><button type="button" class="secondary" onclick="closeModal()">إلغاء</button></div></form>`;$('#modal').classList.add('show');$('#f').onsubmit=e=>{e.preventDefault();onSave(new FormData(e.target));closeModal()}}function closeModal(){$('#modal').classList.remove('show');editing=null}
function openPage(p){({herd,births,deaths,purchases,expenses,sales,vaccines,eweReport,inventory,birthReport,production,alerts,season,profit,summary,movement,backup,buyers,treatments,about}[p])()}
function herd(){shell('🐑 سجل القطيع',`<div class="stats"><div class="stat"><b>${fmt(db.ewes.length)}</b>عدد النعاج</div><div class="stat"><b>${fmt(db.ewes.filter(e=>e.lastBirth).length)}</b>والدة</div><div class="stat"><b>${fmt(db.ewes.filter(e=>e.lastBirth&&days(addMonths(e.lastBirth,7))>0).length)}</b>متأخرة</div></div><button class="primary" onclick="eweForm()">➕ إضافة نعجة</button><input class="search" placeholder="🔎 بحث برقم النعجة" oninput="filterCards(this.value)"><div id="cards">${db.ewes.map(e=>card(`<h3>النعجة رقم ${esc(e.no)}</h3><div>العمر: ${ageText(e.regDate)} — الحالة: ${esc(e.status)}</div><div>تاريخ التسجيل: ${e.regDate} — آخر ولادة: ${e.lastBirth||'—'}</div>${btns('ewes',e)}`)).join('')||'<div class="empty">لا توجد نعاج</div>'}</div>`)}
function eweForm(r={}){let opts=Array.from({length:12},(_,i)=>`<option ${n(r.ageMonths)===i+1?'selected':''}>${i+1}</option>`).join('');formOpen(r.id?'تعديل نعجة':'إضافة نعجة',`<label>رقم النعجة</label><input name="no" required value="${esc(r.no||'')}"><label>العمر عند التسجيل (1–12 شهر)</label><select name="ageMonths">${opts}</select><label>الحالة</label><select name="status"><option>جيدة</option><option ${r.status==='تعبانة'?'selected':''}>تعبانة</option></select><label>تاريخ التسجيل</label><input type="date" name="regDate" required value="${r.regDate||today()}"><label>تاريخ آخر ولادة</label><input type="date" name="lastBirth" value="${r.lastBirth||''}">`,f=>{let o=Object.fromEntries(f);if(db.ewes.some(x=>x.no===o.no&&x.id!==r.id))return alert('رقم النعجة موجود مسبقًا');o.id=r.id||id();db.ewes=r.id?db.ewes.map(x=>x.id===r.id?o:x):[o,...db.ewes];addMove('نعجة',(r.id?'تعديل':'إضافة')+' النعجة '+o.no);save();herd()})}
function births(){shell('👶 المواليد',`<button class="primary" onclick="birthForm()">➕ إضافة مولود</button><div>${db.births.map(raw=>{let b=normalizeBirth(raw);return card(`<h3>الأم ${esc(b.mother)} — ${esc(b.custom||b.type)}</h3><div>التاريخ: ${b.date} — العدد: ${fmt(b.count)} — طليان: ${fmt(b.males)} — رخال: ${fmt(b.females)} — العمر: ${ageText(b.date)}</div>${btns('births',b)}`)}).join('')||'<div class="empty">لا توجد مواليد</div>'}</div>`)}
function birthForm(r={}){let selected=r.type||'طلي';formOpen(r.id?'تعديل مولود':'إضافة مولود',`<label>رقم الأم</label><input name="mother" required value="${esc(r.mother||'')}"><label>نوع المواليد</label><select name="type" id="birthType" onchange="birthOtherToggle()">${['طلي','رخلة','طليان','رخلتين','طلي ورخلة','أخرى'].map(x=>`<option ${selected===x?'selected':''}>${x}</option>`).join('')}</select><div id="birthOther" style="display:${selected==='أخرى'?'block':'none'}"><label>وش جابت الأم؟</label><input name="custom" placeholder="اكتب هنا: 2 طلي و1 رخلة" value="${esc(r.custom||'')}"><label>عدد الطليان</label><input type="number" min="0" name="customMales" value="${r.type==='أخرى'?(r.males||0):0}"><label>عدد الرخال</label><input type="number" min="0" name="customFemales" value="${r.type==='أخرى'?(r.females||0):0}"></div><label>التاريخ</label><input type="date" name="date" required value="${r.date||today()}">`,f=>{let o=Object.fromEntries(f);let mix=o.type==='أخرى'?{males:n(o.customMales),females:n(o.customFemales),count:n(o.customMales)+n(o.customFemales)}:birthMix(o.type,o.custom,1);if(o.type==='أخرى'&&mix.count<1){alert('اكتب عدد الطليان أو الرخال');return}o.id=r.id||id();o.count=mix.count;o.males=mix.males;o.females=mix.females;o.custom=o.type==='أخرى'?(o.custom||((mix.males?mix.males+' طليان ':'')+(mix.females?mix.females+' رخال':''))):'';delete o.customMales;delete o.customFemales;let ex=db.births.find(x=>!r.id&&x.mother===o.mother&&x.date===o.date);if(ex){let a=normalizeBirth(ex);ex.count=a.count+o.count;ex.males=a.males+o.males;ex.females=a.females+o.females;ex.type='أخرى';ex.custom=[a.custom||a.type,o.custom||o.type].filter(Boolean).join(' + ')}else db.births=r.id?db.births.map(x=>x.id===r.id?o:x):[o,...db.births];let e=db.ewes.find(x=>x.no===o.mother);if(e)e.lastBirth=o.date;addMove('مواليد',(r.id?'تعديل':'إضافة')+' مواليد للأم '+o.mother+' عدد '+o.count);save();births()})}
function birthOtherToggle(){let s=$('#birthType'),d=$('#birthOther');if(s&&d)d.style.display=s.value==='أخرى'?'block':'none'}
function deaths(){shell('☠️ النفوق',`<button class="primary" onclick="deathForm()">➕ إضافة نفوق</button>${db.deaths.map(d=>card(`<h3>${esc(d.kind)} — العدد ${fmt(d.count)}</h3><div>${d.kind==='مولود'?'الأم: '+esc(d.mother||'—')+' — النوع: '+esc(d.childType||'—'):'رقم الحيوان: '+esc(d.animalNo||'—')}</div><div>التاريخ: ${d.date}</div>${btns('deaths',d)}`)).join('')||'<div class="empty">لا يوجد نفوق</div>'}`)}function deathForm(r={}){formOpen(r.id?'تعديل نفوق':'إضافة نفوق',`<label>النوع</label><select name="kind" onchange="this.form.querySelector('.baby').style.display=this.value==='مولود'?'block':'none'"><option>نعجة</option><option>طلي</option><option>رخلة</option><option>فحل</option><option ${r.kind==='مولود'?'selected':''}>مولود</option></select><div class="baby" style="display:${r.kind==='مولود'?'block':'none'}"><label>رقم الأم</label><input name="mother" value="${esc(r.mother||'')}"><label>وش اللي مات لها</label><select name="childType"><option>طلي</option><option>رخلة</option><option>طليان</option><option>رخلتين</option><option>أخرى</option></select></div><label>رقم الحيوان (اختياري)</label><input name="animalNo" value="${esc(r.animalNo||'')}"><label>العدد</label><input type="number" min="1" name="count" value="${r.count||1}"><label>التاريخ</label><input type="date" name="date" value="${r.date||today()}">`,f=>{let o=Object.fromEntries(f);o.id=r.id||id();db.deaths=r.id?db.deaths.map(x=>x.id===r.id?o:x):[o,...db.deaths];addMove('نفوق',(r.id?'تعديل':'إضافة')+' نفوق '+o.kind);save();deaths()})}
const purchaseTypes=['علف','شعير','مكعبات','خبز','شبوك','معالف','موية','أخرى'];function purchases(){listMoney('🛒 المشتريات','purchases','إضافة مشتريات',purchaseTypes)}function expenses(){listMoney('💰 المصاريف','expenses','إضافة مصروف',['علاج','راتب العامل','بيطري','نقل','صيانة','كهرباء','وقود','أخرى'])}function listMoney(title,type,label,types){let arr=db[type];shell(title,`<div class="stats"><div class="stat"><b>${fmt(arr.reduce((a,b)=>a+n(b.total||b.amount),0))}</b>الإجمالي</div><div class="stat"><b>${fmt(arr.length)}</b>عدد العمليات</div></div><button class="primary" onclick="moneyForm('${type}')">➕ ${label}</button>${arr.map(r=>card(`<h3>${esc(r.type)}</h3><div>${r.qty?'الكمية: '+fmt(r.qty)+' — سعر الوحدة: '+money(r.price)+' — ':''}الإجمالي: ${money(r.total||r.amount)}</div><div>${r.date}</div>${btns(type,r)}`)).join('')||'<div class="empty">لا توجد سجلات</div>'}`)}function moneyForm(type,r={}){let types=type==='purchases'?purchaseTypes:['علاج','راتب العامل','بيطري','نقل','صيانة','كهرباء','وقود','أخرى'];formOpen(r.id?'تعديل':'إضافة',`<label>النوع</label><select name="type">${types.map(x=>`<option ${r.type===x?'selected':''}>${x}</option>`).join('')}</select>${type==='purchases'?`<label>الكمية</label><input type="number" step="any" name="qty" value="${r.qty||''}"><label>سعر الوحدة</label><input type="number" step="any" name="price" value="${r.price||''}">`:`<label>المبلغ</label><input type="number" step="any" name="amount" value="${r.amount||''}">`}<label>التاريخ</label><input type="date" name="date" value="${r.date||today()}"><label>ملاحظة</label><input name="note" value="${esc(r.note||'')}">`,f=>{let o=Object.fromEntries(f);o.id=r.id||id();if(type==='purchases')o.total=n(o.qty)*n(o.price);db[type]=r.id?db[type].map(x=>x.id===r.id?o:x):[o,...db[type]];addMove(type==='purchases'?'مشتريات':'مصاريف',(r.id?'تعديل ':'إضافة ')+o.type);save();listMoney(type==='purchases'?'🛒 المشتريات':'💰 المصاريف',type,'',types)})}
function sales(){shell('💵 البيع',`<div class="stats"><div class="stat"><b>${fmt(db.sales.reduce((a,b)=>a+n(b.total),0))}</b>إجمالي المبيعات</div><div class="stat"><b>${fmt(db.sales.length)}</b>الرؤوس المباعة</div></div><button class="primary" onclick="saleForm()">➕ إضافة بيع</button>${db.sales.map(r=>card(`<h3>${esc(r.type)} × ${fmt(r.count)}</h3><div>المشتري: ${esc(r.buyer||'غير مسجل')} — الإجمالي: ${money(r.total)}</div><div>${r.date}</div>${btns('sales',r)}`)).join('')||'<div class="empty">لا توجد مبيعات</div>'}`)}function saleForm(r={}){formOpen(r.id?'تعديل بيع':'إضافة بيع',`<label>النوع</label><select name="type"><option>طلي</option><option>رخلة</option><option>نعجة</option><option>فحل</option></select><label>العدد</label><input type="number" min="1" name="count" value="${r.count||1}"><label>رقم الحيوان (اختياري)</label><input name="animalNo" value="${esc(r.animalNo||'')}"><label>سعر الواحد</label><input type="number" name="price" value="${r.price||''}"><label>اسم المشتري</label><input name="buyer" value="${esc(r.buyer||'')}"><label>الجوال</label><input name="phone" value="${esc(r.phone||'')}"><label>التاريخ</label><input type="date" name="date" value="${r.date||today()}">`,f=>{let o=Object.fromEntries(f);o.id=r.id||id();o.total=n(o.count)*n(o.price);db.sales=r.id?db.sales.map(x=>x.id===r.id?o:x):[o,...db.sales];addMove('بيع',(r.id?'تعديل':'إضافة')+' بيع '+o.type);save();sales()})}
function vaccines(){shell('💉 التطعيمات',`<button class="primary" onclick="vaccineForm()">➕ إضافة تطعيم</button>${db.vaccines.map(r=>{let next=addMonths(r.date,r.type==='دود'?3:6),left=-days(next);return card(`<h3>${esc(r.type)} 💉</h3><div>الفئة: ${esc(r.group)} — الحيوان: ${esc(r.animalNo||'الكل')}</div><div>التاريخ: ${r.date} — القادم: ${next} — باقي ${fmt(left)} يوم</div>${btns('vaccines',r)}`)}).join('')||'<div class="empty">لا توجد تطعيمات</div>'}`)}function vaccineForm(r={}){formOpen(r.id?'تعديل تطعيم':'إضافة تطعيم',`<label>الفئة</label><select name="group"><option>الحلال كله</option><option>الطليان</option><option>الرخال</option><option>النعاج</option><option>طلي</option><option>رخلة</option><option>نعجة</option></select><label>نوع التطعيم</label><select name="type"><option>هويجر</option><option>دموي</option><option>معوي</option><option>طاعون</option><option>جدري</option><option>دود</option><option>أخرى</option></select><label>رقم الحيوان إن كان فرديًا</label><input name="animalNo" value="${esc(r.animalNo||'')}"><label>التاريخ</label><input type="date" name="date" value="${r.date||today()}"><label>ملاحظة</label><input name="note" value="${esc(r.note||'')}">`,f=>{let o=Object.fromEntries(f);o.id=r.id||id();db.vaccines=r.id?db.vaccines.map(x=>x.id===r.id?o:x):[o,...db.vaccines];addMove('تطعيم',(r.id?'تعديل':'إضافة')+' '+o.type);save();vaccines()})}
function eweStats(e){let no=String(e.no||e.mother||''),bs=db.births.filter(b=>String(b.mother)===no).map(normalizeBirth),born=bs.reduce((a,b)=>a+n(b.count),0),dead=db.deaths.filter(d=>d.kind==='مولود'&&String(d.mother)===no).reduce((a,b)=>a+n(b.count),0),lastBirth=bs.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]?.date||e.lastBirth||'';return{bs,born,dead,live:Math.max(0,born-dead),last:lastBirth,next:lastBirth?addMonths(lastBirth,6):''}}
function reportMothers(){let map=new Map();db.ewes.forEach(e=>map.set(String(e.no),e));db.births.forEach(b=>{let k=String(b.mother||'');if(k&&!map.has(k))map.set(k,{id:'report-'+k,no:k,status:'—',regDate:'',lastBirth:b.date,_reportOnly:true})});return [...map.values()]}
function eweReport(){let rows=reportMothers();shell('📋 تقرير النعاج',`<input class="search" placeholder="🔎 بحث برقم النعجة" oninput="filterCards(this.value)"><div id="cards">${rows.map(e=>{let s=eweStats(e),types=s.bs.map(b=>esc(b.custom||b.type)).filter(Boolean).join(' | ');return card(`<h3>🐑 النعجة رقم ${esc(e.no)}</h3><div>${e.regDate?'العمر: '+ageText(e.regDate)+' — ':''}الحالة: ${esc(e.status||'—')}</div><div>الولادات: ${fmt(s.bs.length)} — إجمالي المواليد: ${fmt(s.born)} — نفوق: ${fmt(s.dead)} — المواليد الحية: ${fmt(s.live)}</div><div><b>نوع المواليد:</b> ${types||'—'}</div><div>آخر ولادة: ${s.last||'—'} — القادمة: ${s.next||'—'} ${s.next?'— باقي '+fmt(-days(s.next))+' يوم':''}</div>${e._reportOnly?'':btns('ewes',e)}`)}).join('')||'<div class="empty">لا توجد بيانات</div>'}</div>`) }
function inventory(){let system=currentHerdCount();shell('📦 جرد الحلال',`<button class="primary" onclick="inventoryForm()">➕ جرد جديد</button><p class="small">الجرد للمقارنة فقط ولا يغيّر عدد الحلال. عدد الحلال بالنظام الآن: <b>${fmt(system)}</b></p>${db.inventory.map(r=>{let total=n(r.ewes)+n(r.rams)+n(r.lambs)+n(r.females),diff=total-system,msg=diff>0?'🟢 زيادة '+fmt(diff):diff<0?'🔴 نقص '+fmt(Math.abs(diff)):'✅ مطابق';return card(`<h3>📦 جرد ${fmt(total)} رأس</h3><div>نعاج ${fmt(r.ewes)} — فحول ${fmt(r.rams)} — طليان ${fmt(r.lambs)} — رخال ${fmt(r.females)}</div><div>عدد الحلال بالنظام: ${fmt(system)} — <b>${msg}</b></div><div>${r.date}</div>${btns('inventory',r)}`)}).join('')||'<div class="empty">لا يوجد جرد</div>'}`)}function inventoryForm(r={}){formOpen(r.id?'تعديل الجرد':'جرد جديد',`<label>عدد النعاج</label><input type="number" name="ewes" value="${r.ewes||0}"><label>عدد الفحول</label><input type="number" name="rams" value="${r.rams||0}"><label>عدد الطليان</label><input type="number" name="lambs" value="${r.lambs||0}"><label>عدد الرخال</label><input type="number" name="females" value="${r.females||0}"><label>تاريخ الجرد</label><input type="date" name="date" value="${r.date||today()}"><label>ملاحظة</label><input name="note" value="${esc(r.note||'')}">`,f=>{let o=Object.fromEntries(f);o.id=r.id||id();db.inventory=r.id?db.inventory.map(x=>x.id===r.id?o:x):[o,...db.inventory];addMove('جرد',(r.id?'تعديل':'إضافة')+' جرد');save();inventory()})}
function birthReport(){shell('📊 تقرير المواليد',reportBirthBody())}function production(){let rows=reportMothers();shell('🏆 إنتاج النعاج',`<div class="filter"><button>هذا الشهر</button><button>آخر 3 شهور</button><button>آخر 6 شهور</button><button>سنة</button><button>الكل</button></div>${rows.map(e=>{let s=eweStats(e),types=s.bs.map(b=>esc(b.custom||b.type)).filter(Boolean).join(' | ');return card(`<h3>🏆 النعجة ${esc(e.no)}</h3><div>الولادات: ${fmt(s.bs.length)} — إجمالي مواليدها: ${fmt(s.born)} — النفوق: ${fmt(s.dead)} — الحية: ${fmt(s.live)}</div><div>نوع المواليد: ${types||'—'}</div><div>آخر ولادة: ${s.last||'—'} — القادمة: ${s.next||'—'}</div>${e._reportOnly?'':btns('ewes',e)}`)}).join('')||'<div class="empty">لا توجد بيانات</div>'}`)}
function reportBirthBody(){let t=birthTotals();let deadM=db.deaths.filter(d=>d.kind==='مولود'&&['طلي','طليان'].includes(d.childType)).reduce((a,b)=>a+n(b.count),0),deadF=db.deaths.filter(d=>d.kind==='مولود'&&['رخلة','رخلتين'].includes(d.childType)).reduce((a,b)=>a+n(b.count),0),dead=deadM+deadF+db.deaths.filter(d=>d.kind==='مولود'&&!['طلي','طليان','رخلة','رخلتين'].includes(d.childType)).reduce((a,b)=>a+n(b.count),0);return `<div class="stats"><div class="stat"><b>${fmt(Math.max(0,t.count-dead))}</b>إجمالي المواليد الحالي</div><div class="stat"><b>${fmt(Math.max(0,t.males-deadM))}</b>عدد الطليان</div><div class="stat"><b>${fmt(Math.max(0,t.females-deadF))}</b>عدد الرخال</div></div><div class="filter"><button>هذا الشهر</button><button>آخر 3 أشهر</button><button>آخر 6 أشهر</button><button>هذه السنة</button><button>الكل</button></div>${db.ewes.map(e=>{let x=eweStats(e),m=x.bs.reduce((a,b)=>a+n(b.males),0),f=x.bs.reduce((a,b)=>a+n(b.females),0);return card(`<h3>الأم ${esc(e.no)}</h3><div>عدد الولادات: ${fmt(x.bs.length)} — إجمالي المواليد: ${fmt(x.born)} — طليان: ${fmt(m)} — رخال: ${fmt(f)} — المواليد الحالية الحية: ${fmt(x.live)}</div>${btns('ewes',e)}`)}).join('')}`}
function alertData(){let a=[];db.ewes.forEach(e=>{if(e.lastBirth){let target=addMonths(e.lastBirth,6),left=-days(target);if(left<=30)a.push({type:left<0?'متأخرة':'قرب الولادة',text:`النعجة ${e.no} — ${left<0?'متأخرة '+Math.abs(left):'باقي '+left} يوم`})}});db.vaccines.forEach(v=>{let next=addMonths(v.date,v.type==='دود'?3:6),left=-days(next);if(left<=7)a.push({type:'تطعيم',text:`${v.type} — باقي ${left} يوم`})});return a}function alerts(){let a=alertData();shell('🔔 التنبيهات',`<div class="stats"><div class="stat"><b>${fmt(a.filter(x=>x.type==='قرب الولادة').length)}</b>قرب الولادة</div><div class="stat"><b>${fmt(a.filter(x=>x.type==='متأخرة').length)}</b>متأخرة</div><div class="stat"><b>${fmt(a.filter(x=>x.type==='تطعيم').length)}</b>تطعيمات</div><div class="stat"><b>${fmt(a.length)}</b>الإجمالي</div></div>${a.map(x=>card(`<h3>${x.type}</h3><div>${esc(x.text)}</div>`)).join('')||'<div class="empty">🎉 لا توجد تنبيهات</div>'}`)}function season(){let rows=reportMothers().map(e=>({e,s:eweStats(e)})).filter(x=>x.s.last);shell('📅 موسم الولادات',`${rows.map(({e,s})=>{let next=s.next,left=-days(next);return card(`<h3>🐑 النعجة ${esc(e.no)}</h3><div>آخر ولادة: ${s.last} — المتوقعة: ${next}</div><div>نوع آخر مواليد: ${s.bs.length?esc(s.bs.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0].custom||s.bs.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0].type):'—'}</div><span class="pill">${left>=0?'باقي '+fmt(left)+' يوم':'متأخرة '+fmt(Math.abs(left))+' يوم'}</span>${e._reportOnly?'':btns('ewes',e)}`)}).join('')||'<div class="empty">لا توجد مواعيد</div>'}`)}
function profit(){let s=db.sales.reduce((a,b)=>a+n(b.total),0),p=db.purchases.reduce((a,b)=>a+n(b.total),0),e=db.expenses.reduce((a,b)=>a+n(b.amount),0);shell('📈 الربح والخسارة',`<div class="stats"><div class="stat"><b>${fmt(s)}</b>المبيعات</div><div class="stat"><b>${fmt(p)}</b>المشتريات</div><div class="stat"><b>${fmt(e)}</b>المصاريف</div><div class="stat"><b>${fmt(s-p-e)}</b>صافي النتيجة</div></div><div class="filter"><button>هذا الشهر</button><button>3 شهور</button><button>6 شهور</button><button>سنة</button><button>الكل</button></div>${['sales','purchases','expenses'].flatMap(t=>db[t].map(r=>card(`<h3>${t==='sales'?'بيع':t==='purchases'?'شراء':'مصروف'} — ${esc(r.type)}</h3><div>${r.date} — ${money(r.total||r.amount)}</div>${btns(t,r)}`))).join('')}`)}function summary(){let bt=birthTotals(),born=bt.count,babyDead=db.deaths.filter(d=>d.kind==='مولود').reduce((a,b)=>a+n(b.count),0),dead=db.deaths.reduce((a,b)=>a+n(b.count),0),s=db.sales.reduce((a,b)=>a+n(b.total),0),p=db.purchases.reduce((a,b)=>a+n(b.total),0),e=db.expenses.reduce((a,b)=>a+n(b.amount),0),lastBirth=db.births.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0],lastSale=db.sales.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0],lastVac=db.vaccines.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0],nextVac=lastVac?addMonths(lastVac.date,lastVac.type==='دود'?3:6):'';shell('📋 الملخص',card(`<h3>🐑 الحلال</h3><div>عدد الحلال الحالي: ${fmt(currentHerdCount())} — عدد النعاج المنتجة: ${fmt(db.ewes.length)}</div>`)+card(`<h3>💙 المواليد والنفوق</h3><div>إجمالي المواليد: ${fmt(born)} — الطليان: ${fmt(bt.males)} — الرخال: ${fmt(bt.females)} — نفوق المواليد: ${fmt(babyDead)} — إجمالي النفوق: ${fmt(dead)}</div><div>آخر ولادة: ${lastBirth?esc(lastBirth.mother)+' — '+lastBirth.date+' — '+esc(lastBirth.custom||lastBirth.type):'—'}</div>`)+card(`<h3>💉 التطعيمات</h3><div>آخر تطعيم: ${lastVac?esc(lastVac.type)+' — '+lastVac.date:'—'}${nextVac?' — القادم: '+nextVac:''}</div>`)+card(`<h3>💰 المالية</h3><div>إجمالي البيع: ${money(s)} — المشتريات: ${money(p)} — المصاريف: ${money(e)} — الربح / الخسارة: ${money(s-p-e)}</div><div>آخر بيع: ${lastSale?esc(lastSale.type)+' — '+lastSale.date+' — '+money(lastSale.total):'—'}</div>`)+card(`<h3>🔔 المتابعة</h3><div>التنبيهات: ${fmt(alertData().length)} — المتأخرة: ${fmt(alertData().filter(x=>x.type==='متأخرة').length)} — قرب الولادة: ${fmt(alertData().filter(x=>x.type==='قرب الولادة').length)}</div>`))}
function movement(){shell('🕘 سجل الحركة',`<div class="filter"><button>اليوم</button><button>شهر</button><button>3 شهور</button><button>6 شهور</button><button>سنة</button><button>الكل</button></div><input class="search" placeholder="🔎 بحث" oninput="filterCards(this.value)"><div id="cards">${db.movements.map(r=>card(`<h3>${esc(r.type)}</h3><div>${esc(r.text)}</div><div class="small">${new Date(r.date).toLocaleString('ar-SA')}</div>${btns('movements',r)}`)).join('')||'<div class="empty">لا توجد حركات</div>'}</div>`)}function backup(){shell('💾 النسخة الاحتياطية',card(`<p>أنشئ نسخة تحفظ جميع بيانات البرنامج أو استعد نسخة سابقة.</p><div class="actions"><button class="primary" onclick="backupNow()">⬇️ إنشاء نسخة احتياطية</button><button class="secondary" onclick="$('#restoreFile').click()">⬆️ استعادة نسخة</button></div>`))}function backupNow(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='aziz2027-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}$('#restoreFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{db=Object.assign({},blank,JSON.parse(r.result));save();alert('تمت الاستعادة')}catch{alert('الملف غير صالح')}};r.readAsText(f)}
function buyers(){let map={};db.sales.filter(s=>s.buyer).forEach(s=>{let k=s.phone||s.buyer;if(!map[k])map[k]={buyer:s.buyer,phone:s.phone,count:0,total:0};map[k].count++;map[k].total+=n(s.total)});let arr=Object.values(map);shell('👥 سجل المشترين',`<div class="stats"><div class="stat"><b>${fmt(arr.length)}</b>عدد المشترين</div><div class="stat"><b>${fmt(db.sales.length)}</b>عمليات البيع</div><div class="stat"><b>${fmt(db.sales.reduce((a,b)=>a+n(b.total),0))}</b>إجمالي المبيعات</div></div><input class="search" placeholder="🔎 بحث بالاسم أو الجوال" oninput="filterCards(this.value)"><div id="cards">${arr.map(r=>card(`<h3>${esc(r.buyer)}</h3><div>${esc(r.phone||'')} — عمليات الشراء: ${fmt(r.count)} — الإجمالي: ${money(r.total)}</div><div class="actions"><button class="primary" onclick="wa('${esc(r.phone)}','${esc(r.buyer)}')">واتساب</button></div>`)).join('')||'<div class="empty">لا يوجد مشترون</div>'}</div>`)}function wa(phone,name){let msg=`السلام عليكم ورحمة الله وبركاته 🌹\nمتوفر لدينا حلال للبيع 🐑\nحلال طيب ومختار، واللي له رغبة بالشراء أو الاستفسار حياه الله يتواصل معنا.\nنسعد بخدمتكم وثقتكم دائمًا — حلال أبو خالد`;let digits=String(phone||'').replace(/\D/g,'');if(!digits){alert('لا يوجد رقم جوال للمشتري');return}if(digits.startsWith('00966'))digits=digits.slice(2);if(digits.startsWith('05'))digits='966'+digits.slice(1);else if(digits.startsWith('5')&&digits.length===9)digits='966'+digits;else if(digits.startsWith('9660'))digits='966'+digits.slice(4);let url='https://wa.me/'+digits+'?text='+encodeURIComponent(msg);let w=window.open(url,'_blank');if(!w)window.location.href=url}
function treatments(){shell('💊 سجل العلاجات',`<button class="primary" onclick="treatmentForm()">➕ إضافة علاج</button><input class="search" placeholder="🔎 بحث باسم العلاج" oninput="filterCards(this.value)"><div id="cards">${db.treatments.map(r=>card(`<h3>💊 ${esc(r.name)}</h3><div>الجرعة: ${esc(r.dose)} سم — الطريقة: ${esc(r.method)}</div><div>${esc(r.note||'')}</div>${btns('treatments',r)}`)).join('')||'<div class="empty">لا توجد علاجات</div>'}</div>`)}function treatmentForm(r={}){formOpen(r.id?'تعديل علاج':'إضافة علاج',`<label>اسم العلاج</label><input name="name" required value="${esc(r.name||'')}"><label>كم سم</label><input name="dose" value="${esc(r.dose||'')}"><label>طريقة الإعطاء</label><select name="method"><option>لحم</option><option ${r.method==='تحت الجلد'?'selected':''}>تحت الجلد</option></select><label>ملاحظة</label><input name="note" value="${esc(r.note||'')}">`,f=>{let o=Object.fromEntries(f);o.id=r.id||id();db.treatments=r.id?db.treatments.map(x=>x.id===r.id?o:x):[o,...db.treatments];addMove('علاج',(r.id?'تعديل ':'إضافة ')+o.name);save();treatments()})}function about(){shell('👤 نبذة عن صاحب البرنامج',card(`<div class="about"><h2>عزيز مصلح الجهني</h2><div>أبو خالد</div><div>📱 0564554878</div><div>🐑 حلال أبو خالد — برنامج لإدارة ومتابعة الحلال.</div><div class="small">الإصدار aziz2027</div></div>`))}
function editRec(type,rid){let r=db[type].find(x=>x.id===rid);if(!r)return;({ewes:eweForm,births:birthForm,deaths:deathForm,purchases:x=>moneyForm('purchases',x),expenses:x=>moneyForm('expenses',x),sales:saleForm,vaccines:vaccineForm,inventory:inventoryForm,treatments:treatmentForm}[type]||(()=>alert('هذا السجل للعرض التلقائي')))(r)}function delRec(type,rid){if(!confirm('هل أنت متأكد من حذف هذا السجل؟'))return;if(!db[type]||!Array.isArray(db[type])){alert('تعذر الحذف');return}let before=db[type].length;db[type]=db[type].filter(x=>String(x.id)!==String(rid));if(db[type].length===before){alert('لم يتم العثور على السجل');return}localStorage.setItem(K,JSON.stringify(db));refresh();let current=$('#view h2')?.textContent||'';if(current.includes('تقرير المواليد'))birthReport();else if(current.includes('تقرير النعاج'))eweReport();else if(current.includes('إنتاج النعاج'))production();else if(current.includes('موسم الولادات'))season();else if(current.includes('الربح والخسارة'))profit();else if(current.includes('القطيع'))herd();else if(current.includes('المواليد'))births();else if(current.includes('النفوق'))deaths();else if(current.includes('المشتريات'))purchases();else if(current.includes('المصاريف'))expenses();else if(current.includes('البيع'))sales();else if(current.includes('التطعيمات'))vaccines();else if(current.includes('الجرد'))inventory();else if(current.includes('العلاجات'))treatments();else if(current.includes('الحركة'))movement();else home()}function filterCards(q){q=q.trim();document.querySelectorAll('#cards .card').forEach(c=>c.style.display=c.textContent.includes(q)?'block':'none')}document.addEventListener('click',function(e){let b=e.target.closest('.js-delete,.js-edit');if(!b)return;e.preventDefault();e.stopPropagation();let type=b.dataset.type,rid=b.dataset.id;if(b.classList.contains('js-delete'))delRec(type,rid);else editRec(type,rid)});function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('aziz2027-theme',document.body.classList.contains('light')?'light':'dark')}if(localStorage.getItem('aziz2027-theme')==='light')document.body.classList.add('light');ensureIds();refresh();
