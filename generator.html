<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مولد أكواد حلال أبو خالد</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07140f;
  color:white;
}
.box{
  max-width:520px;
  margin:60px auto;
  padding:25px;
  background:#0d2118;
  border:1px solid #28543e;
  border-radius:18px;
}
h2{
  text-align:center;
  color:#58d68d;
}
label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
}
input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border-radius:10px;
  border:1px solid #39614e;
  background:#07140f;
  color:white;
  font-size:18px;
  direction:ltr;
  text-align:center;
}
button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#2fa052;
  color:white;
  font-size:17px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h2>🐑 مولد أكواد حلال أبو خالد</h2>

<label>رقم الجهاز</label>
<input id="device" autocomplete="off">

<button onclick="copyDevice()">نسخ رقم الجهاز</button>

<button onclick="generate()">توليد الكود</button>

<label>كود التفعيل</label>
<input id="code" readonly>

<button onclick="copyCode()">نسخ كود التفعيل</button>

</div>

<script>
function makeCode(device){
  device = String(device || '').trim().toUpperCase();

  let hash = 2166136261;

  const secret = 'ABU-KHALID-AZIZ2027-PERMANENT';

  const text = device + '|' + secret;

  for(let i=0;i<text.length;i++){
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash,16777619);
  }

  const part = (hash >>> 0)
    .toString(16)
    .toUpperCase()
    .padStart(8,'0');

  return 'AK-' + part;
}

function generate(){
  const device = document.getElementById('device').value.trim();

  if(!device){
    alert('أدخل رقم الجهاز');
    return;
  }

  document.getElementById('code').value = makeCode(device);
}

function copyDevice(){
  const value = document.getElementById('device').value.trim();

  if(!value){
    alert('أدخل رقم الجهاز');
    return;
  }

  navigator.clipboard.writeText(value);
}

function copyCode(){
  const value = document.getElementById('code').value.trim();

  if(!value){
    alert('ولد الكود أولاً');
    return;
  }

  navigator.clipboard.writeText(value);
}
</script>

</body>
</html>
